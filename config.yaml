agent:
  # Tool calling: el LLM elige que herramienta usar cuando el parser
  # deterministico no reconoce la frase. false = solo parser (mas rapido,
  # menos flexible).
  enabled: true
  # Timeout en segundos para llamadas al LLM en modo agente
  timeout: 30
  # Máximo de pasos encadenados por petición
  max_steps: 3
hud:
  # Ventana sin marco del SO (chrome propio, esquinas redondeadas, sombra).
  # En algunas sesiones Wayland/GNOME una ventana sin marco + transparente
  # deja de recibir foco de teclado (no se puede escribir). Por defecto OFF:
  # ventana normal decorada por el SO, que funciona en todas partes.
  frameless: false
  # Modo agente (tool calling del LLM) dentro del HUD. Añade decenas de
  # segundos por turno en CPU. El parser determinista (abrir apps, clima,
  # volumen, recordatorios…) sigue activo con esto en false.
  agent: false
jarvis:
  language: es
  max_history: 20
  name: JARVIS
memory:
  # Recuerdo automatico: JARVIS busca por significado las memorias relevantes
  # al mensaje y las inyecta como contexto. Requiere el modelo de embeddings
  # (ollama pull bge-m3). Si no esta, cae a busqueda por palabras.
  auto_recall: true
logging:
  actions_log: actions.log
  dir: logs
  errors_log: errors.log
ollama:
  # Parametros del agente (tool calling). Mas ajustados que los del chat:
  # el modelo solo debe emitir una llamada a herramienta, no redactar.
  agent_num_ctx: 2048
  agent_num_predict: 60
  host: http://localhost:11434
  # C4: mantener el modelo en RAM entre turnos (evita ~10 s de recarga)
  keep_alive: 30m
  # Modelo unico de JARVIS: llama3.2:3b para routing (agent_model) y para el
  # chat (model). JARVIS funciona solo con este modelo instalado.
  #   agent_model -> tool calling / router      model -> conversacion
  # Historico: qwen2.5:3b y hermes3:3b se evaluaron para routing. hermes3:3b
  # DESCARTADO (1/12; no emite tool_calls fiables en el 3B). qwen2.5:3b empata
  # con llama pero es mas lento; queda como fallback opcional del router
  # (router_fallback). Ver docs/AUDITORIA_2026-09.md §7.
  # Cambio rapido sin editar este archivo:
  #   JARVIS_AGENT_MODEL=<modelo>  y/o  JARVIS_CHAT_MODEL=<modelo>
  agent_model: llama3.2:3b
  model: llama3.2:3b
  # Fallback del router SOLO ante fallo tecnico del modelo (no ante fallo de
  # una herramienta). Vacio o ausente = sin fallback. Requiere tenerlo pulled.
  router_fallback: qwen2.5:3b
  # PLAN_EJECUCION FASE C · C5 — 2048 se quedaba corto para lo que el chat
  # ocupa de verdad: medido en sesión real, cada intercambio (usuario +
  # respuesta) ronda ~100-110 tokens; con max_history=20 (jarvis.max_history,
  # 40 mensajes) una conversación llena se acerca a ~2500 tokens de system +
  # historial, por encima del límite -> context-shift habría empezado a
  # descartar los turnos más viejos a mitad de sesión, e invalidado de paso
  # el prefijo cacheado de C4. 4096 cubre una sesión de 20 turnos con margen
  # para memoria manual + recuerdo automático. agent_num_ctx se queda en
  # 2048: el agente usa historial acotado (history[-6:]) y 3-4 esquemas del
  # top-K de C3; medido en C3, sus prompts rondan 800-1100 tokens, con
  # margen de sobra dentro de 2048.
  num_ctx: 4096
  num_predict: 120
  timeout: 600
safety:
  allowed_apps:
  - chrome
  - vscode
  - explorador
  - powershell
  - terminal
  - wsl
  allowed_folders:
  - '%USERPROFILE%\Documents'
  - '%USERPROFILE%\Downloads'
  - '%USERPROFILE%\Desktop'
  simulation_mode: false
voice:
  stt_compute_type: int8
  stt_duration: 8
  stt_language: es
  stt_min_threshold: 5.0e-05
  stt_model: small
  stt_noise_floor: 0.00033246
  stt_sample_rate: 16000
  tts_enabled: true
  tts_rate: 175
  tts_voice: es-MX-JorgeNeural
  tts_volume: 1.0
