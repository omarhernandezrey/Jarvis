name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Job nocturno (03:17 UTC): corre los tests `live` que pegan a APIs reales
    # (Open-Meteo, Wikipedia, WolframAlpha, empleo). No se corren en cada push.
    - cron: "17 3 * * *"

jobs:
  # PLAN_EJECUCION FASE D · punto 0 — este es el job que de verdad importa: el
  # desarrollo y el protocolo de pruebas del proyecto (CLAUDE.md) son en
  # Linux (`QT_QPA_PLATFORM=offscreen pytest test -q`). Antes NO existía un
  # job de Linux; solo estaba el de Windows, en rojo desde antes de FASE B
  # sin que nadie pudiera diagnosticarlo (ni logs, ni máquina Windows a mano).
  # Este job SÍ falla quiere decir algo real, verificado en el mismo SO donde
  # se escribe y prueba el código.
  test-linux:
    name: Tests (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Librerías del sistema
        # Reproducido en local con `docker run python:3.11-slim`: sin estas
        # libs, PySide6.QtQuick / sounddevice fallan al IMPORTAR y revientan
        # la colección entera de pytest (no un test suelto). espeak-ng para
        # que pyttsx3 tenga backend real; playerctl para las teclas
        # multimedia; xdg-user-dirs para que ~/Documents etc. existan (varios
        # tests de archivos escriben ahí).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libfontconfig1 libfreetype6 \
            libdbus-1-3 libgssapi-krb5-2 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libx11-6 \
            libxrender1 libxext6 libsm6 libice6 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-shm0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-xkb1 libxcb-glx0 libxcb-util1 \
            libportaudio2 espeak-ng playerctl xdg-user-dirs
          xdg-user-dirs-update --force

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Tests
        # Sin Ollama ni micro en el runner: los tests que los necesitan se
        # saltan solos (skipif) o usan dobles de prueba (`_mc_test`).
        env:
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest test -v --tb=short

  # PLAN_EJECUCION FASE J · J5 — el job de Windows se ELIMINÓ aquí (estaba
  # antes de "live"). Llevaba en rojo desde antes de FASE B sin que nadie
  # pudiera diagnosticarlo: sin máquina Windows a mano, y sin acceso a los
  # logs del runner (la API de logs de un job devuelve 403 "Must have admin
  # rights to Repository" incluso leyendo runs públicos; `gh auth` tampoco
  # está disponible en este entorno). Era `continue-on-error`, así que nunca
  # bloqueó nada — pero un CI permanentemente rojo e indiagnosticable no
  # informa nada tampoco: ni ayuda a confiar en el soporte Windows ni avisa
  # de una regresión real. docs/PLAN_EJECUCION.md (sección J5) documenta el
  # límite exacto y cómo revivirlo si alguien retoma soporte Windows con
  # acceso admin al repo o una máquina Windows real donde reproducirlo.
  live:
    name: Integracion live (nocturno)
    # Solo en el cron nocturno o lanzado a mano; nunca en push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests live (APIs reales)
        env:
          PYTHONIOENCODING: utf-8
        # sin WolframAlpha app_id en CI: ese test se skippea solo
        run: python -m pytest -m live -v --tb=short

  security:
    name: Auditoria de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: pip install bandit pip-audit

      - name: Bandit (codigo)
        run: bandit -r jarvis_local -ll
        continue-on-error: true

      - name: pip-audit (dependencias)
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Verificar que no se suban secretos
        shell: bash
        run: |
          set -e
          for f in secrets.yaml credentials.json token.json; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "::error::$f esta versionado y no debe estarlo"
              exit 1
            fi
          done
          echo "OK: ningun archivo de credenciales esta versionado"
